<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>The Return to Me</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f4ed;color:#39372e;font:15px system-ui}main{max-width:660px;margin:auto;padding:30px 22px 100px}h1{font:normal 49px Georgia;margin:14px 0}h2{font:normal 25px Georgia;margin:24px 0 12px}small,.eyebrow{letter-spacing:3px;text-transform:uppercase;color:#82765f;font-size:11px}.card{background:#fffdf8;border:1px solid #e5ded3;border-radius:18px;padding:19px;margin:14px 0}label{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eee8dd}input[type=checkbox]{accent-color:#75836a;width:20px;height:20px;flex-shrink:0}button{border:0;border-radius:24px;background:#75836a;color:white;padding:12px 20px;font:inherit;cursor:pointer}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8;display:flex;justify-content:center;gap:8px;padding:12px}nav button{background:transparent;color:#514d41;padding:10px 8px;font-size:12px}nav{gap:2px;flex-wrap:wrap}input[type=text],select{width:100%;font:inherit;padding:10px;border:1px solid #ddd4c5;border-radius:9px;background:#fffdf8}details{margin:12px 0}summary{cursor:pointer;font-weight:600} .minor{background:#eee8dd;color:#514d41;padding:8px 12px;margin:5px 0}nav button.active{background:#75836a;color:white}progress{width:100%;accent-color:#75836a;height:12px}textarea,input[type=date]{font:inherit;border:1px solid #ddd4c5;background:#fffdf8;border-radius:10px;padding:12px;width:100%}textarea{min-height:120px;resize:vertical}.muted{color:#817765} .big{font:42px Georgia}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.days button{padding:12px 0;background:#eee8dd;color:#514d41;border-radius:9px}.days button.done{background:#75836a;color:white}</style><main><div class="eyebrow">A personal reset · 60 days</div><h1>The Return to Me.</h1><p class="muted">Deen. Wellbeing. Wealth. Purpose. Joy.</p><div id="content"></div></main><nav><button onclick="show('today')">Today</button><button onclick="show('journey')">Journey</button><button onclick="show('plan')">Plan</button><button onclick="show('meals')">Meals</button><button onclick="show('fitness')">Fitness</button><button onclick="show('settings')">Settings</button></nav><script>let groups={'Deen':['Fajr','Dhuhr','Asr','Maghrib','Isha','Read or listen to Quran / make dua'],'Wellbeing':['Eat regular nourishing meals','Drink water','Move or stretch for 10 minutes','Wind down and care for my hair / skin'],'Purpose & money':['Spend 15 minutes on one priority','Check spending or make an intentional money choice'],'Joy & self-trust':['Do something enjoyably just for me','Reflect without judging myself']};let tasks=Object.values(groups).flat();let storage;try{storage=JSON.parse(localStorage.getItem('returnToMe')||'{}')}catch{storage={}}let key=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};storage.start ||= key(); if(storage.customGroups){groups=storage.customGroups;tasks=Object.values(groups).flat()} let selected=key();function save(){try{localStorage.setItem('returnToMe',JSON.stringify(storage))}catch{}}function day(){return storage[selected] ||= {checks:{},note:''}}function count(d){return Object.values(d?.checks||{}).filter(Boolean).length}function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function toggle(i,v){day().checks[i]=v;save();progress()}function progress(){let n=count(day());document.getElementById('pct').textContent=Math.round(n/tasks.length*100)+'%';document.getElementById('bar').value=n;document.getElementById('num').textContent=n+' / '+tasks.length+' completed'}function show(page){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===page));let c=document.getElementById('content');if(page==='today'){let i=0;c.innerHTML=`<div class="card"><small>Daily progress · ${selected}</small><div class="big" id="pct"></div><progress id="bar" max="${tasks.length}"></progress><p id="num" class="muted"></p><p>A missed habit is an invitation to return, not a reason to quit.</p></div>`+Object.entries(groups).map(([g,t])=>`<h2>${g}</h2><div class="card">${t.map(x=>{let j=i++;return `<label><input type="checkbox" ${day().checks[j]?'checked':''} onchange="toggle(${j},this.checked)">${x}</label>`}).join('')}</div>`).join('')+`<h2>Dear me,</h2><p>What made today fulfilling? What do I need tomorrow?</p><textarea oninput="day().note=this.value;save()">${esc(day().note)}</textarea>`;progress()}if(page==='journey'){c.innerHTML='<h2>Your 60-day journey</h2><p>Tap a day to revisit it. Green means you checked in, not that you were perfect.</p><div class="days">'+Array.from({length:60},(_,i)=>{let d=new Date(storage.start+'T12:00:00');d.setDate(d.getDate()+i);let k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return `<button class="${count(storage[k])?'done':''}" onclick="selected='${k}';show('today')">${i+1}</button>`}).join('')+'</div><p><button onclick="selected=key();show(\'today\')">Back to today</button></p>'}if(page==='plan'){let p=['Book a primary care visit and dental checkup','Make a realistic debt payoff plan','Decide business structure and register if needed','Apply for free EIN directly with IRS','Complete Shopify and product listings','Test payments, packaging and shipping','Soft launch jewelry collection','Plan two creative content sessions','Try a free yoga sculpt workout','Schedule a solo date or time with a friend'];storage.plan||={};c.innerHTML='<h2>Make it happen.</h2><div class="card">'+p.map((x,i)=>`<label><input type="checkbox" ${storage.plan[i]?'checked':''} onchange="storage.plan[${i}]=this.checked;save()">${x}</label>`).join('')+'</div><h2>Weekly rhythm</h2><div class="card">'+rhythm.map((x,i)=>`<p><strong>${weekdays[i]}</strong><br>${esc(x)}</p>`).join('')+'</div><p>Adjust this rhythm around your office days.</p>'}if(page==='meals'){meals(c)}if(page==='fitness'){fitness(c)}if(page==='settings'){c.innerHTML=`<h2>Settings</h2><h3>Edit daily habits</h3><p>One habit per line in each category. Saving a new list resets old checklist marks (journal entries stay).</p>${Object.entries(groups).map(([g,t],i)=>`<p>${esc(g)}</p><textarea id="group${i}">${esc(t.join('\n'))}</textarea>`).join('')}<button onclick="editHabits()">Save habits</button><h3>Import a backup</h3><input type="file" accept="application/json" onchange="restore(this.files[0])"><label>Reset start date</label><input type="date" value="${esc(storage.start)}" onchange="storage.start=this.value;save()"><p>Your entries stay in this browser on this device. Clearing browser data may delete them. This is not a password-protected journal.</p><button onclick="let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(storage,null,2)],{type:'application/json'}));a.download='reset-backup.json';a.click()">Export backup</button>`}}
const weekdays=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let rhythm=storage.rhythm||['Lower-body strength · easy evening','Yoga sculpt · jewelry business','Rest · midweek meal refresh','Upper-body strength · jewelry business','Rest · deen and finances','Yoga sculpt or Pilates · groceries and content','Rest · hair day, meal prep and reset'];
const defaults=[
['Chicken shawarma bowls','30 min','Halal chicken (1 lb), basmati rice (1 cup dry), cucumber, tomatoes, Greek yogurt, lemon, garlic, cumin, paprika, olive oil','Season chicken with spices, lemon and oil. Roast at 425°F until 165°F internally. Cook rice. Mix yogurt, lemon and garlic. Divide into 3–4 bowls; pack fresh vegetables separately.'],
['Salmon rice bowls','25 min','Salmon (1 lb), rice (1 cup dry), edamame, cucumber, avocado, lemon','Bake salmon at 400°F until 145°F internally. Cook rice and edamame. Divide into 3–4 bowls; add cucumber, avocado and lemon when serving.'],
['Mediterranean pasta salad','20 min','Pasta (8 oz), chickpeas (1 can), cucumber, tomatoes, halal-suitable feta, lemon, olive oil','Cook pasta, drain and cool promptly. Toss with drained chickpeas, vegetables, feta, lemon and oil. Divide into 3–4 portions and refrigerate.'],
['Beef and sweet potato bowls','30 min','Halal ground beef (1 lb), 2 sweet potatoes, avocado, cottage cheese, paprika, olive oil','Cube potatoes and roast at 425°F for 25 minutes. Brown beef to 160°F internally. Divide into 3–4 bowls, adding avocado and cottage cheese when serving.'],
['Chicken Caesar wraps','15 min with cooked chicken','Cooked halal chicken, romaine, tortillas, Greek yogurt, lemon, garlic, halal-suitable parmesan','Mix yogurt, lemon and garlic for dressing. Fill tortillas with chicken, lettuce, cheese and dressing. Assemble the morning you eat them.'],
['Berry overnight oats','5 min prep','Rolled oats (½ cup), milk (½ cup), Greek yogurt (¼ cup), chia seeds (1 tsp), berries','Mix in a jar, refrigerate overnight. Add berries before eating. Adjust texture with milk. Makes one serving.']];
storage.recipes ||= defaults; storage.menus ||= {};storage.groceries ||= {};storage.workouts ||= {};storage.rhythm ||= rhythm; storage.goal ||= 4;
function week(){let d=new Date(selected+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function meals(c){let w=week(), m=storage.menus[w]||={}, g=storage.groceries[w]||={};c.innerHTML=`<h2>Halal kitchen</h2><p class="muted">Week of ${w} · nourishing meals, not restriction</p><input type="date" value="${selected}" onchange="selected=this.value;show('meals')"><div class="card"><h3>Weekly meal plan</h3>${weekdays.map((d,i)=>`<p><b>${d}</b></p>${['Breakfast','Lunch','Dinner'].map((slot,j)=>`<small>${slot}</small><select onchange="setMeal(${i*3+j},this.value)"><option value="">Choose a meal</option>${[...new Set([...storage.recipes.map(r=>r[0]),m[i*3+j]].filter(Boolean))].map(n=>`<option ${m[i*3+j]===n?'selected':''} value="${esc(n)}">${esc(n)}</option>`).join('')}</select>`).join('')}`).join('')}</div><div class="card"><h3>Grocery checklist</h3><p>Trader Joe’s / Aldi: produce, grains, dairy, fish. Halal grocer: certified meat. Verify labels for prepared foods.</p>${['Trader Joe’s','Aldi','Halal grocer'].map((store,i)=>`<h4>${store}</h4><textarea placeholder="One grocery item per line" onchange="setGrocery(${i},this.value)">${esc(g[i]?.text||['Rice, oats, edamame, salmon, lemons','Greek yogurt, berries, cucumbers, tomatoes, sweet potatoes, tortillas, chickpeas','Halal chicken, halal ground beef'][i]).replaceAll(', ','\n')}</textarea>${(g[i]?.text||['Rice\noats\nedamame\nsalmon\nlemons','Greek yogurt\nberries\ncucumbers\ntomatoes\nsweet potatoes\ntortillas\nchickpeas','Halal chicken\nhalal ground beef'][i]).split('\n').filter(Boolean).map((x,j)=>`<label><input type="checkbox" ${g[i]?.checks?.[j]?'checked':''} onchange="checkGrocery(${i},${j},this.checked)">${esc(x)}</label>`).join('')}`).join('')}</div><div class="card"><h3>Recipe book</h3>${storage.recipes.map((r,i)=>`<details><summary>${esc(r[0])} · ${esc(r[1])}</summary><p><b>Ingredients</b><br>${esc(r[2])}</p><p><b>Method</b><br>${esc(r[3])}</p><button class="minor" onclick="editRecipe(${i})">Edit</button> <button class="minor" onclick="if(confirm('Remove recipe?')){storage.recipes.splice(${i},1);save();show('meals')}">Remove</button></details>`).join('')}<button onclick="editRecipe(-1)">Add recipe</button></div><div class="card"><h3>Sunday prep</h3><p>Choose two lunches, cook grains and proteins, chop vegetables, and portion meals. Refrigerate within 2 hours; use refrigerated leftovers in 3–4 days or freeze later portions. Refresh Wednesday. Reheat cooked leftovers to 165°F.</p><a href="https://ask.fsis.usda.gov/article/How-do-I-handle-leftovers-safely">USDA storage guidance</a></div>`}
function setMeal(i,v){(storage.menus[week()]||={})[i]=v;save()}
function setGrocery(i,v){(storage.groceries[week()]||={})[i]={text:v,checks:{}};save();show('meals')}
function checkGrocery(i,j,v){let g=storage.groceries[week()]||={};g[i]||={};(g[i].checks||={})[j]=v;save()}
function editRecipe(i){let r=storage.recipes[i]||['','','',''];document.getElementById('content').innerHTML=`<h2>${i<0?'Add':'Edit'} recipe</h2>${['Name','Time','Ingredients','Instructions'].map((n,j)=>`<p>${n}</p><textarea id="recipe${j}">${esc(r[j])}</textarea>`).join('')}<button onclick="saveRecipe(${i})">Save recipe</button> <button class="minor" onclick="show('meals')">Cancel</button>`}
function saveRecipe(i){let r=Array.from({length:4},(_,j)=>document.getElementById('recipe'+j).value.trim());if(!r[0])return alert('Enter a recipe name');if(i<0)storage.recipes.push(r);else storage.recipes[i]=r;save();show('meals')}
function fitness(c){let w=week(), f=storage.workouts[w]||{}, n=Object.values(f).filter(Boolean).length;c.innerHTML=`<h2>Movement & Sunday reset</h2><p>Week of ${w}</p><input type="date" value="${selected}" onchange="selected=this.value;show('fitness')"><div class="card"><small>Weekly workouts</small><div class="big">${n} / ${storage.goal}</div><progress max="${storage.goal}" value="${n}"></progress><p>Goal: <select onchange="storage.goal=Number(this.value);save();show('fitness')">${[1,2,3,4,5,6,7].map(n=>`<option ${storage.goal===n?'selected':''}>${n}</option>`).join('')}</select></p>${weekdays.map((d,i)=>`<p><b>${d}</b></p><input type="text" value="${esc(rhythm[i])}" onchange="rhythm[${i}]=this.value;storage.rhythm=rhythm;save()"><label><input type="checkbox" ${f[i]?'checked':''} onchange="(storage.workouts[week()]||={})[${i}]=this.checked;save();show('fitness')">Workout completed</label>`).join('')}</div><div class="card"><h3>Sunday reset</h3>${['Wash and condition hair','Detangle and style gently','Meal prep and pack lunches','Laundry and work outfits','Review calendar and business priorities','Make time for Quran and rest'].map((t,i)=>`<label><input type="checkbox" ${storage.sunday?.[w]?.[i]?'checked':''} onchange="(storage.sunday||={});(storage.sunday[week()]||={})[${i}]=this.checked;save()">${t}</label>`).join('')}</div>`}
function editHabits(){if(!confirm('Save habits and clear previous checklist marks? Journal entries will stay.'))return;groups=Object.fromEntries(Object.keys(groups).map((g,i)=>[g,document.getElementById('group'+i).value.split('\n').map(s=>s.trim()).filter(Boolean)]));tasks=Object.values(groups).flat();if(!tasks.length){alert('Keep at least one habit');location.reload();return}storage.customGroups=groups;Object.values(storage).forEach(v=>{if(v&&typeof v==='object'&&v.checks)v.checks={}});save();show('today')}
async function restore(file){if(!file)return;try{let v=JSON.parse(await file.text());if(!v||typeof v!=='object'||Array.isArray(v)||typeof v.start!=='string')throw Error();if(confirm('Replace current data with backup?')){localStorage.setItem('returnToMe',JSON.stringify(v));location.reload()}}catch{alert('Could not read backup')}}

save();show('today')</script></html>
